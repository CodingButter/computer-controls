<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The page may load nothing from anywhere. Everything it needs is beside it
      on disk, so the policy that says exactly that costs nothing and closes the
      door a skin author might otherwise be tempted to open.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src ws://127.0.0.1:*"
    />
    <title>widget</title>
    <link rel="stylesheet" href="skin.css" />
    <!--
      The bare `three` specifier inside the vendored shader resolves to a local
      file beside this page, so the face ships as a 'self' script under the CSP
      and never reaches across the network for a dependency. The map is a local
      same-origin file, which is what script-src 'self' permits; the shader and
      its three.module.js live under face/ (outside the top-level scan no-ears
      reads) because three.module.js carries dead audio-path substrings the
      widget never invokes.
    -->
    <script type="importmap" src="face/import-map.json"></script>
  </head>
  <body>
    <!--
      The whole face: a circle, and a line of text under it. A skin restyles
      these; it cannot add a third thing that talks to the hub, because there is
      nothing on this page that talks to the hub except the module below.
    -->
    <!--
      Where the scouts land. The window covers the whole display, so a scout is
      a small orb positioned at an element's real rectangle: the layer is empty
      whenever the agent is touching nothing, which is most of the time. A skin
      restyles them; it cannot put one on the screen, because the only thing
      that creates one is the hub reporting work.
    -->
    <div id="scouts"></div>
    <div id="widget" class="presence-hidden activity-listening">
      <div id="orb">
        <!--
          The shader renders here when WebGL is available; the CSS orb below is
          the no-WebGL fallback the widget already had. The canvas is a child of
          #orb so the renderer's gesture and click-through geometry — keyed off
          #orb's bounding box — keep working unchanged.
        -->
        <canvas id="orb-canvas"></canvas>
      </div>
      <p id="caption"></p>
    </div>
    <!--
      The one menu. Right-click on the face opens it; the face offers what the
      face can do: go away for this turn, or go away for good. A skin restyles
      these the way it restyles the orb; it cannot add a third option, because
      there is nothing else on this page that talks to the hub or the shell.
    -->
    <div id="menu" hidden>
      <button id="menu-dismiss" type="button">Dismiss</button>
      <button id="menu-quit" type="button">Quit</button>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
