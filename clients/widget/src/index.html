<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The page may load nothing from anywhere except the two places the design
      names. Everything it draws and runs is beside it on disk ('self'); the
      two network doors are the hub's loopback lane and Google's realtime
      endpoint, which the mouth dials with a hub-minted token. Each widening
      here is deliberate and pinned by boundaries tests:

      - worker-src 'self': the ear's transcription runs in a local worker.
      - 'wasm-unsafe-eval': the worker's speech model is ONNX WASM; the term
        is Chromium's name for "may compile WebAssembly", not an eval grant.
      - wss://generativelanguage.googleapis.com: where the mouth talks. The
        host is spelled out rather than wildcarded, because the CSP is the
        page-side half of the promise that audio goes exactly one place.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' ws://127.0.0.1:* wss://generativelanguage.googleapis.com"
    />
    <title>widget</title>
    <link rel="stylesheet" href="skin.css" />
    <!--
      The shader and its three.module.js live under face/ (outside the
      top-level scan the boundaries suite reads) because three.module.js
      carries dead audio-path substrings the widget never invokes. The shader
      imports it by relative path — no import map. There used to be one here,
      loaded from an external file, and Chromium silently ignores external
      import maps: the shader never mounted and the widget wore the CSS
      fallback while every suite stayed green.
    -->
  </head>
  <body>
    <!--
      The whole face: a circle, and a line of text under it. A skin restyles
      these; it cannot add a third thing that talks to the hub, because there is
      nothing on this page that talks to the hub except the module below.
    -->
    <!--
      Where the scouts land. The window covers the whole display, so a scout is
      a small orb positioned at an element's real rectangle: the layer is empty
      whenever the agent is touching nothing, which is most of the time. A skin
      restyles them; it cannot put one on the screen, because the only thing
      that creates one is the hub reporting work.
    -->
    <div id="scouts"></div>
    <div id="widget" class="presence-hidden activity-listening">
      <div id="orb">
        <!--
          The shader renders here when WebGL is available; the CSS orb below is
          the no-WebGL fallback the widget already had. The canvas is a child of
          #orb so the renderer's gesture and click-through geometry — keyed off
          #orb's bounding box — keep working unchanged.
        -->
        <canvas id="orb-canvas"></canvas>
      </div>
      <p id="caption"></p>
    </div>
    <!--
      The one menu. Right-click on the face opens it; the face offers what the
      face can do: show the dashboard, go away for this turn, or go away for
      good. A skin restyles these the way it restyles the orb; it cannot add a
      fourth option, because there is nothing else on this page that talks to
      the hub or the shell.
    -->
    <div id="menu" hidden>
      <button id="menu-dashboard" type="button">Open the dashboard</button>
      <button id="menu-dismiss" type="button">Dismiss</button>
      <button id="menu-quit" type="button">Quit</button>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
