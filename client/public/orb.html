<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>computer controls</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: #08090d;
        color: #e8e8ef;
        height: 100vh;
        overflow: hidden;
      }

      /* A faint pool of light that drifts around the room. Subtle on purpose:
         it reads as ambience, never as content. */
      body::before {
        content: "";
        position: fixed;
        inset: -50vmax;
        pointer-events: none;
        background: radial-gradient(
          circle 55vmax at 50% 50%,
          rgba(168, 85, 247, 0.07),
          rgba(217, 70, 239, 0.03) 55%,
          transparent 70%
        );
        animation: drift 48s ease-in-out infinite;
      }
      @keyframes drift {
        0%   { transform: translate(-12vw, -10vh); }
        25%  { transform: translate(14vw, -6vh); }
        50%  { transform: translate(10vw, 12vh); }
        75%  { transform: translate(-14vw, 8vh); }
        100% { transform: translate(-12vw, -10vh); }
      }

      /* The page is one presence on dark ground. Everything else is secondary
         by construction: the log is a drawer that is closed until asked for. */
      #stage {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }

      #orb {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 0;
        padding: 0;
        cursor: pointer;
        background: radial-gradient(circle at 35% 30%, #7c4dd8, #241b3a 70%);
        box-shadow: 0 0 60px rgba(168, 85, 247, 0.3);
        transition: box-shadow 400ms ease, transform 400ms ease;
      }
      #orb:focus-visible { outline: 2px solid #6f7de8; outline-offset: 8px; }

      /* State is motion, not a label. Each state has its own movement, so the
         thing can be read across a room without any text being legible. */
      #orb[data-state="idle"] { animation: breathe 6s ease-in-out infinite; }
      #orb[data-state="listening"] {
        background: radial-gradient(circle at 35% 30%, #2f8f6a, #11302a 70%);
        box-shadow: 0 0 80px rgba(47, 143, 106, 0.45);
        animation: pulse 1.6s ease-in-out infinite;
      }
      #orb[data-state="thinking"] {
        background: radial-gradient(circle at 35% 30%, #8f7a2f, #302a11 70%);
        box-shadow: 0 0 70px rgba(143, 122, 47, 0.4);
        animation: churn 2.4s linear infinite;
      }
      #orb[data-state="speaking"] {
        background: radial-gradient(circle at 35% 30%, #5b6de8, #1b1f3a 70%);
        box-shadow: 0 0 90px rgba(91, 109, 232, 0.5);
        animation: speak 900ms ease-in-out infinite;
      }
      #orb[data-off="true"] { opacity: 0.35; cursor: not-allowed; animation: none; }

      /* The WebGL canvas replaces the button when a 3D context is available.
         A wider footprint than the sphere itself, so the smoke that swirls
         around the orb has room to live. Higher render resolution for
         sharpness. */
      #orb-canvas {
        width: 260px;
        height: 260px;
        cursor: pointer;
      }
      #orb-canvas[hidden] { display: none; }

      /* The Mastra M, resting inside the orb. It ignores the pointer so every
         click still lands on the orb beneath it. */
      #orb-holder {
        position: relative;
        /* A faded reflection on the floor beneath the whole presence. */
        -webkit-box-reflect: below 4px
          linear-gradient(transparent 45%, rgba(0, 0, 0, 0.5));
      }
      #orb-m {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 72px;
        height: auto;
        pointer-events: none;
        color: #f5ecff;
        filter: drop-shadow(0 0 5px rgba(233, 213, 255, 0.95))
          drop-shadow(0 0 16px rgba(192, 132, 252, 0.8))
          drop-shadow(0 0 36px rgba(147, 51, 234, 0.55));
      }

      /* The pool of light the sphere casts beneath itself. */
      #orb-holder::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -30px;
        width: 150px;
        height: 34px;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at center, rgba(168, 85, 247, 0.4), transparent 70%);
        filter: blur(10px);
        pointer-events: none;
      }

      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes pulse { 0%, 100% { transform: scale(1.02); } 50% { transform: scale(1.1); } }
      @keyframes churn { from { transform: rotate(0deg) scale(1.02); } to { transform: rotate(360deg) scale(1.02); } }
      @keyframes speak { 0%, 100% { transform: scale(1.05); } 50% { transform: scale(1.14); } }
      @media (prefers-reduced-motion: reduce) {
        #orb { animation: none !important; }
        body::before { animation: none !important; }
      }

      #caption {
        min-height: 3em;
        max-width: 46ch;
        text-align: center;
        color: #b9bbd4;
        font-size: 17px;
      }
      #reason { max-width: 44ch; text-align: center; color: #ff9b9b; font-size: 14px; }

      #talk {
        margin-top: 6px;
        padding: 10px 22px;
        border-radius: 999px;
        border: 1px solid #3a2d55;
        background: #1b1526;
        color: #d9c9f5;
        font-size: 15px;
        cursor: pointer;
      }
      #talk[data-live="true"] {
        border-color: #7c3aed;
        background: #2a1b45;
        box-shadow: 0 0 18px rgba(147, 51, 234, 0.45);
      }

      /* The chat log, demoted to a drawer. */
      #drawer {
        position: fixed;
        inset: 0 0 0 auto;
        width: min(420px, 92vw);
        background: #101119;
        border-left: 1px solid #232535;
        transform: translateX(100%);
        transition: transform 260ms ease;
        display: flex;
        flex-direction: column;
      }
      #drawer[data-open="true"] { transform: translateX(0); }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .turn { max-width: 100%; white-space: pre-wrap; font-size: 14px; }
      .turn.you { align-self: flex-end; background: #23263a; padding: 8px 12px; border-radius: 10px; }
      .turn.agent { align-self: flex-start; color: #cfd1e6; }

      #drawer-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        /* The drawer is fixed and later in the DOM: without this it paints
           over the toggle when open, leaving no way to close the log. */
        z-index: 1;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #2b2e44;
        background: #171926;
        color: #b9bbd4;
        cursor: pointer;
      }
      form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #232535; }
      input {
        flex: 1;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #333650;
        background: #1a1c28;
        color: inherit;
      }
      button[type="submit"] { padding: 10px 16px; border-radius: 8px; border: 0; background: #4d5bd8; color: white; }
    </style>
  </head>
  <body>
    <main id="stage">
      <div id="orb-holder">
        <button id="orb" data-state="idle" aria-label="Toggle listening"></button>
        <canvas id="orb-canvas" width="520" height="520" aria-label="Toggle listening" hidden></canvas>
        <!-- The Mastra M. Path from the Mastra playground asset, unmodified. -->
        <svg id="orb-m" viewBox="0 0 34 21" fill="none" aria-hidden="true">
          <path
            d="M4.49805 11.6934C6.98237 11.6934 8.99609 13.7081 8.99609 16.1924C8.9959 18.6765 6.98225 20.6904 4.49805 20.6904C2.01394 20.6903 0.000196352 18.6765 0 16.1924C0 13.7081 2.01382 11.6935 4.49805 11.6934ZM10.3867 0C12.8709 0 14.8846 2.01388 14.8848 4.49805C14.8848 4.8377 14.847 5.16846 14.7755 5.48643C14.4618 6.88139 14.1953 8.4633 14.9928 9.65L16.2575 11.5319C16.3363 11.6491 16.4727 11.7115 16.6137 11.703C16.7369 11.6957 16.8525 11.6343 16.9214 11.5318L18.1876 9.64717C18.9772 8.47198 18.7236 6.90783 18.4205 5.52484C18.3523 5.21392 18.3164 4.89094 18.3164 4.55957C18.3167 2.07546 20.3313 0.0615234 22.8154 0.0615234C25.2994 0.0617476 27.3132 2.0756 27.3135 4.55957C27.3135 4.93883 27.2665 5.30712 27.178 5.65896C26.8547 6.94441 26.5817 8.37932 27.2446 9.52714L28.459 11.6301C28.4819 11.6697 28.5245 11.6934 28.5703 11.6934C31.0545 11.6935 33.0684 13.7081 33.0684 16.1924C33.0682 18.6765 31.0544 20.6903 28.5703 20.6904C26.0861 20.6904 24.0725 18.6765 24.0723 16.1924C24.0723 15.8049 24.1212 15.4288 24.2133 15.0701C24.5458 13.7746 24.8298 12.3251 24.1609 11.1668L23.0044 9.16384C22.9656 9.09659 22.8931 9.05859 22.8154 9.05859C22.7983 9.05859 22.7824 9.06614 22.7728 9.08033L21.4896 10.9895C20.686 12.1851 20.9622 13.781 21.284 15.1851C21.3582 15.5089 21.3975 15.8461 21.3975 16.1924C21.3973 18.6764 19.3834 20.6902 16.8994 20.6904C14.4152 20.6904 12.4006 18.6765 12.4004 16.1924C12.4004 15.932 12.4226 15.6768 12.4651 15.4286C12.6859 14.14 12.8459 12.7122 12.1167 11.6271L11.2419 10.3253C10.6829 9.49347 9.71913 9.05932 8.78286 8.70188C7.0906 8.05584 5.88867 6.41734 5.88867 4.49805C5.88886 2.0139 7.90254 3.29835e-05 10.3867 0Z"
            fill="currentColor"
          />
        </svg>
      </div>
      <p id="caption" aria-live="polite"></p>
      <button id="talk" type="button" data-live="false" aria-pressed="false">Talk</button>
      <p id="reason" hidden></p>
    </main>

    <div id="nav-drawer-root"></div>

    <button id="drawer-toggle" type="button" aria-expanded="false">Log</button>
    <aside id="drawer" data-open="false" aria-label="Conversation">
      <div id="log"></div>
      <form id="composer">
        <input id="message" autocomplete="off" placeholder="Type instead…" />
        <button type="submit">Send</button>
      </form>
    </aside>

    <!-- three.js r169 — vendored as an ES module, served by the hub at
         /vendor/three.module.js and imported by orb-webgl.js with a relative
         specifier. No import map, no bundler, no runtime CDN fetch (#103). -->
    <script type="module" src="/orb.js"></script>
    <script type="module">
      import { initNavDrawer } from "/nav-drawer.js";
      initNavDrawer({ mount: document.getElementById("nav-drawer-root") });
    </script>
  </body>
</html>
