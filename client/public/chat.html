<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>computer controls</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: #12131a;
        color: #e8e8ef;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid #262838;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #scope { color: #8a8ca6; font-size: 13px; }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .turn { max-width: 70ch; white-space: pre-wrap; }
      .turn.you { align-self: flex-end; background: #23263a; padding: 8px 12px; border-radius: 10px; }
      .turn.agent { align-self: flex-start; }
      .turn.failed { color: #ff9b9b; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #262838; }
      input {
        flex: 1;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #333650;
        background: #1a1c28;
        color: inherit;
      }
      button { padding: 10px 16px; border-radius: 8px; border: 0; background: #4d5bd8; color: white; }
      button[disabled] { opacity: 0.5; }
      #talk { background: #2c8a5f; display: none; user-select: none; touch-action: none; }
      #talk.recording { background: #c14953; }
    </style>
  </head>
  <body>
    <div id="nav-drawer-root"></div>
    <header>
      <strong>computer controls</strong>
      <span id="scope">connecting…</span>
    </header>
    <div id="log"></div>
    <form id="composer">
      <input id="message" autocomplete="off" placeholder="Ask about the desktop…" autofocus />
      <button id="talk" type="button">Hold to talk</button>
      <button id="send" type="submit">Send</button>
    </form>
    <script type="module" src="/app.js"></script>
    <script type="module">
      import { initNavDrawer } from "/nav-drawer.js";
      initNavDrawer({ mount: document.getElementById("nav-drawer-root") });
    </script>
  </body>
</html>
