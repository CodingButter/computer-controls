# Same answer the plugin gives, for the same reason: pnpm refuses to finish an
# install that silently skipped a dependency's build script, and an unanswered
# package fails `pnpm install` outright. Every entry below arrives underneath
# `@mastra/core` and belongs to a feature this client does not touch — model
# providers, browser automation, an ONNX runtime, protobuf codegen. Their builds
# compile native binaries we never load.
#
# So: build nothing. If a future dependency genuinely needs its build to run,
# flip that one entry and say why.
allowBuilds:
  '@google/genai': false
  agent-browser: false
  bufferutil: false
  edgedriver: false
  geckodriver: false
  onnxruntime-node: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm64@1.2.2'

# One zod, one @mastra/core: a second zod major splits the peer graph and
# mints a second nominally-distinct copy of core, which tsc then refuses.
overrides:
  zod: 3.25.76
